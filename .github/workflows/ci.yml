name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支被连续推送时，取消上一次还没跑完的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建 + 单元测试 + 服务端 GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 Gradle 用户目录：Loom 的 Minecraft 依赖与 remap 缓存都在里面，冷启动能省几分钟
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # build 依赖 test 与 runGameTest（服务端 GameTest 启动真实专用服务端）
      - name: 构建并运行单元测试与服务端 GameTest
        run: ./gradlew build --console=plain --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传发布产物（供人工检查）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  client-gametest:
    name: 客户端 GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 托管 runner 只有 2 核。软件渲染默认会吃满所有核心，把同进程里的集成服务端饿死
      # （表现为 Can't keep up! 与世界加载超时），因此限定 llvmpipe 只用一个线程。
      LP_NUM_THREADS: 1
      LIBGL_ALWAYS_SOFTWARE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 客户端用例要拉起真实的图形客户端。CI 上没有显示器，用 Xvfb 提供虚拟显示；
      # 渲染走 Mesa 的软件后端（llvmpipe），够 Minecraft 用。
      #
      # 重试一次是有意的：框架加载世界有 60 秒的硬编码上限（ClientGameTestImpl.waitForWorldLoad），
      # 托管 runner 磁盘/CPU 抖动时偶发超时，失败点与用例断言无关。两次都失败仍然判失败。
      - name: 安装 Xvfb 与 Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libopenal1

      - name: 运行客户端 GameTest
        run: |
          for attempt in 1 2; do
            echo "::group::第 ${attempt} 次运行"
            if xvfb-run -a --server-args="-screen 0 854x480x24" ./gradlew runClientGameTest --console=plain --stacktrace; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::第 ${attempt} 次运行失败，清理运行目录后重试"
            ./gradlew --stop || true
            rm -rf build/run/clientGameTest
          done
          echo "::error::客户端 GameTest 连续两次失败"
          exit 1

      # 用例会留截图，失败时也要拿到，方便判断是渲染问题还是断言问题
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-gametest-screenshots
          path: build/run/clientGameTest/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传客户端测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-gametest-logs
          path: build/run/clientGameTest/logs
          if-no-files-found: ignore
          retention-days: 7
