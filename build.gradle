plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 生态依赖：编译期可见，运行期可选（未安装时功能降级，不得崩溃）。
    // 这些是 LGPL-3.0 / CC0-1.0 的独立模组，我们只链接它们的公开类，不复制代码。
    modCompileOnly "maven.modrinth:malilib:${project.malilib_version}"
    modCompileOnly "maven.modrinth:litematica:${project.litematica_version}"
    modCompileOnly "maven.modrinth:syncmatica:${project.syncmatica_version}"

    // 开发环境运行时（runClient 时提供真实依赖；正式发布不打包它们）
    modLocalRuntime "maven.modrinth:malilib:${project.malilib_version}"
    modLocalRuntime "maven.modrinth:litematica:${project.litematica_version}"
    modLocalRuntime "maven.modrinth:syncmatica:${project.syncmatica_version}"

    // Syncmatica 的命令注册需要 fabric-permissions-api，否则开发运行期启动服务端会
    // NoClassDefFoundError: me/lucko/fabric/api/permissions/v0/Permissions（正式环境由玩家自行安装）
    modLocalRuntime "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"

    // 让测试运行在 Fabric 运行时中：Minecraft 的 yarn 映射存在跨包 package-private 访问，
    // 纯 JUnit JVM 下会 IllegalAccessError，必须由 loader 的 dev 期变换处理。
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// GameTest：在真实服务端上验证「扫描真实区块里的方块实体」与「取消后不复活已删除区域」。
// 单测跑不了这两条——它们需要真实的 ServerWorld / MinecraftServer。
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "lmp-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

// 允许把 GameTest 单独挑出来跑：`./gradlew runGameTest -PlmpTestFilter=<测试名>`。
// 测量类用例需要独占一批，否则同批其它测试的结构生成会污染 tick 时间基线。
tasks.matching { it.name == "runGameTest" }.configureEach {
    if (project.hasProperty("lmpTestFilter")) {
        systemProperty "fabric-api.gametest.filter", project.property("lmpTestFilter")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
